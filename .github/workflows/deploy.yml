name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Validate required repo Variables are set
        env:
          WEBROOT_PATH: ${{ vars.WEBROOT_PATH }}
        run: |
          : "${WEBROOT_PATH:?WEBROOT_PATH repo Variable is not set}"

      - run: npm ci

      - run: npm run build

      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Ship site
        run: |
          rsync -avz --delete -e "ssh -p ${{ secrets.VPS_SSH_PORT }} -o StrictHostKeyChecking=accept-new" \
            _site/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ vars.WEBROOT_PATH }}/"

      - name: Update Notion deploy tracker
        continue-on-error: true
        run: |
          if [[ -z "${{ secrets.NOTION_API_KEY }}" || -z "${{ secrets.NOTION_PAGE_ID }}" ]]; then
            echo "Notion tracking not configured, skipping."
            exit 0
          fi
          VERSION="$(git describe --tags --always)"
          DEPLOY_DATE="$(date -u +"%Y-%m-%dT%H:%M:%S+00:00")"
          BODY="$(jq -nc \
            --arg version "$VERSION" \
            --arg date "$DEPLOY_DATE" \
            '{
              properties: {
                Version: { rich_text: [{ text: { content: $version } }] },
                "Last Deployed": { date: { start: $date } },
                Status: { select: { name: "Live" } }
              }
            }')"
          curl -sf --connect-timeout 5 --max-time 10 -X PATCH "https://api.notion.com/v1/pages/${{ secrets.NOTION_PAGE_ID }}" \
            -H "Authorization: Bearer ${{ secrets.NOTION_API_KEY }}" \
            -H "Notion-Version: 2022-06-28" \
            -H "Content-Type: application/json" \
            -d "$BODY" > /dev/null
